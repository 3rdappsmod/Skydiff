<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self';" />
<title>SkyDiff</title>
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/layout.css" />
</head>
<body class="theme-light">
<div id="app">

  <header class="topbar">
    <div class="topbar-left">
      <button id="btnCollapseSidebar" class="icon-btn" title="사이드바 접기/펼치기">&#9776;</button>
      <input id="titleInput" class="title-input" value="제목 없는 비교" spellcheck="false" />
    </div>
    <div class="topbar-right">
      <button id="btnReset" class="btn">초기화</button>
      <button id="btnExport" class="btn">내보내기</button>
      <button id="btnSave" class="btn">저장</button>
      <button id="btnShare" class="btn">공유</button>
      <button id="btnDescription" class="btn">설명</button>
    </div>
  </header>

  <div class="body-area">

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-scroll">

        <section class="side-section">
          <h3>표시</h3>

          <div class="field">
            <label>레이아웃</label>
            <div class="segmented" id="layoutToggle">
              <button type="button" data-value="side-by-side" class="seg-btn active">나란히 보기</button>
              <button type="button" data-value="unified" class="seg-btn">합쳐 보기</button>
            </div>
          </div>

          <div class="field switch-field">
            <label for="liveEditToggle">실시간 편집</label>
            <input type="checkbox" id="liveEditToggle" class="switch" checked />
          </div>

          <div class="field switch-field">
            <label for="ignoreWhitespaceToggle">공백 변경 숨기기</label>
            <input type="checkbox" id="ignoreWhitespaceToggle" class="switch" />
          </div>

          <div class="field switch-field">
            <label for="hideUnchangedToggle">변경 없는 행 숨기기</label>
            <input type="checkbox" id="hideUnchangedToggle" class="switch" />
          </div>

          <div class="field switch-field">
            <label for="wordWrapToggle">줄바꿈 비활성화</label>
            <input type="checkbox" id="wordWrapToggle" class="switch" />
          </div>

          <div class="field">
            <label for="granularitySelect">비교 단위</label>
            <select id="granularitySelect">
              <option value="smart">스마트</option>
              <option value="line">줄 단위</option>
              <option value="word">단어 단위</option>
              <option value="char">문자 단위</option>
            </select>
          </div>

          <div class="field">
            <label for="syntaxSelect">구문</label>
            <select id="syntaxSelect">
              <option value="plaintext">없음</option>
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
              <option value="json">JSON</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="kotlin">Kotlin</option>
              <option value="csharp">C#</option>
              <option value="cpp">C++</option>
              <option value="go">Go</option>
              <option value="rust">Rust</option>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="xml">XML</option>
              <option value="yaml">YAML</option>
              <option value="markdown">Markdown</option>
              <option value="sql">SQL</option>
              <option value="shell">Shell</option>
            </select>
          </div>
        </section>

        <section class="side-section">
          <button type="button" class="side-expand-btn" id="btnAppearance">
            <span>모양 변경</span><span class="chevron">&#8250;</span>
          </button>
          <div class="side-expand-panel hidden" id="appearancePanel">
            <div class="field color-field">
              <label for="colorAdded">추가된 내용 색상</label>
              <input type="color" id="colorAdded" />
            </div>
            <div class="field color-field">
              <label for="colorRemoved">삭제된 내용 색상</label>
              <input type="color" id="colorRemoved" />
            </div>
            <button type="button" class="link-btn" id="btnResetColors">기본값으로 재설정</button>
          </div>
        </section>

        <section class="side-section">
          <h3>처리</h3>

          <button type="button" class="side-expand-btn" id="btnExclude">
            <span>제외</span><span class="chevron">&#8250;</span>
          </button>
          <div class="side-expand-panel hidden" id="excludePanel">
            <p class="hint">비교에서 제외할 패턴을 추가하세요. (일반 텍스트 또는 정규식)</p>
            <div id="excludeList" class="exclude-list"></div>
            <button type="button" class="link-btn" id="btnAddExclude">+ 패턴 추가</button>
          </div>

          <button type="button" class="side-expand-btn" id="btnTransform">
            <span>텍스트 변환</span><span class="chevron">&#8250;</span>
          </button>
          <div class="side-expand-panel hidden" id="transformPanel">
            <div class="field switch-field">
              <label for="tfTrim">앞뒤 공백 제거</label>
              <input type="checkbox" id="tfTrim" class="switch" />
            </div>
            <div class="field switch-field">
              <label for="tfIgnoreCase">대소문자 무시</label>
              <input type="checkbox" id="tfIgnoreCase" class="switch" />
            </div>
            <div class="field switch-field">
              <label for="tfRemoveEmpty">빈 줄 제거</label>
              <input type="checkbox" id="tfRemoveEmpty" class="switch" />
            </div>
            <div class="field switch-field">
              <label for="tfSort">줄 정렬</label>
              <input type="checkbox" id="tfSort" class="switch" />
            </div>
          </div>
        </section>

        <section class="side-section">
          <button type="button" class="side-action-btn" id="btnFirstChange">
            <span class="icon">&#8677;</span> 첫 변경으로
          </button>
        </section>

      </div>

      <div class="saved-comparisons">
        <div class="saved-header">
          <span>저장된 비교 결과</span>
        </div>
        <div class="saved-list" id="savedList">
          <p class="empty-hint">저장한 비교 결과가 여기에 표시됩니다.</p>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <div id="warningBanner" class="warning-banner hidden"></div>

      <!-- 입력 화면 (비교 전) -->
      <div id="inputView" class="input-view">
        <div class="input-pane">
          <div class="pane-header">
            <span>원본</span>
            <button type="button" class="link-btn" id="btnOpenOriginal">파일 열기</button>
          </div>
          <div id="originalEditor" class="monaco-host draggable"></div>
        </div>
        <div class="input-pane">
          <div class="pane-header">
            <span>수정본</span>
            <button type="button" class="link-btn" id="btnOpenModified">파일 열기</button>
          </div>
          <div id="modifiedEditor" class="monaco-host draggable"></div>
        </div>
      </div>

      <div class="compare-bar">
        <button type="button" id="btnCompare" class="btn btn-primary">비교하기</button>
      </div>

      <!-- 결과 화면 (비교 후) -->
      <div id="resultView" class="result-view hidden">
        <div class="result-stats">
          <div class="stat stat-removed">
            <span id="statRemovedCount">0 삭제</span>
            <button type="button" class="link-btn" id="btnCopyOriginal">복사</button>
          </div>
          <button type="button" class="icon-btn" id="btnSwapSides" title="원본/수정본 바꾸기">&#8646;</button>
          <div class="stat stat-added">
            <span id="statAddedCount">0 추가</span>
            <button type="button" class="link-btn" id="btnCopyModified">복사</button>
          </div>
        </div>
        <div id="diffContainer" class="diff-container"></div>
      </div>
    </main>
  </div>
</div>

<!-- 설명 모달 -->
<div id="descriptionModal" class="modal hidden">
  <div class="modal-backdrop" data-close-modal="descriptionModal"></div>
  <div class="modal-box">
    <h2>설명</h2>
    <textarea id="descriptionInput" class="modal-textarea" placeholder="이 비교에 대한 설명을 입력하세요..."></textarea>
    <div class="modal-actions">
      <button type="button" class="btn" data-close-modal="descriptionModal">취소</button>
      <button type="button" class="btn btn-primary" id="btnSaveDescription">저장</button>
    </div>
  </div>
</div>

<!-- 정보 모달 -->
<div id="aboutModal" class="modal hidden">
  <div class="modal-backdrop" data-close-modal="aboutModal"></div>
  <div class="modal-box">
    <h2>SkyDiff</h2>
    <p class="about-version">버전 <span id="aboutVersion">-</span></p>
    <p class="about-desc">하늘색 테마의 크로스플랫폼 텍스트 비교(diff) 프로그램입니다.</p>
    <p class="about-libs">사용 라이브러리: Monaco Editor, jsdiff, Electron</p>
    <div class="modal-actions">
      <button type="button" class="btn" id="btnAboutGithub">GitHub 저장소</button>
      <button type="button" class="btn btn-primary" data-close-modal="aboutModal">닫기</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="../../vendor/diff/diff.min.js"></script>
<script src="../../vendor/monaco/vs/loader.js"></script>
<script src="js/diffEngine.js"></script>
<script src="js/diffView.js"></script>
<script src="js/app.js"></script>
</body>
</html>
